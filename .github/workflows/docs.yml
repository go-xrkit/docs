name: docs

# Every documentation version is a separate Hugo build, published under
# https://go-xrkit.github.io/docs/<version>/ on the gh-pages branch, where <version> is
# the minor version of the code the pages describe (params.docs.version in
# hugo.yaml: v0.3.1 -> 0.3), or "main" while no release is tagged. Each push to
# main replaces that version's path and leaves the others alone. Pull requests
# build and check, and publish nothing.
#
# ⛔ This replaced MkDocs Material plus mike: a Python toolchain, a
# requirements.txt and a pip install to render a static site for a pure-Go
# organisation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hugo is installed with `go install github.com/gohugoio/hugo@v$HUGO_VERSION`,
  # so the Go checksum database vouches for what is built. See the install step.
  HUGO_VERSION: "0.167.0"
  DOCS_URL: "https://go-xrkit.github.io/docs"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # themes/hextra is the tannevaled/hextra fork, pinned to a release tag.
          submodules: recursive
          # The whole history: each page's date comes from git.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        # ⛔⛔ HUGO COMES FROM THE MODULE PROXY, NOT FROM releases/download.
        # Hugo is a Go program, so `go install` at a pinned version gets it
        # through proxy.golang.org with the checksum database vouching for the
        # bytes -- which is a stronger guarantee than the sha256 this step used
        # to carry, because that hash had to be updated by hand on every bump
        # and nothing checked that anybody had.
        #
        # ⭐ AND IT IS WHAT A LIVE OUTAGE FORCED. On 2026-11-08 GitHub's
        # release-asset CDN answered 504 for releases/download, and this step
        # failed three times in a row:
        #
        #   curl: (22) The requested URL returned error: 504
        #
        # Three probes from a workstation at 11:16 CET placed the fault:
        # hugo_0.167.0_linux-amd64.tar.gz 504, an unrelated repository's
        # actionlint tarball 504, api.github.com 200. So releases/download
        # specifically, for two unrelated repositories, while the REST API was
        # fine. proxy.golang.org is a different service and was unaffected.
        #
        # ⚠ THIS IS THE PLAIN BUILD, NOT hugo_extended, which is what the
        # tarball above was too -- the URL said hugo_, not hugo_extended_. The
        # site builds with it: verified on a workstation against this
        # repository's content, 19 pages with --panicOnWarning. A theme that
        # starts needing SCSS transpiled by libsass will need the extended
        # build and cgo, and that is a decision to take then, out loud.
        run: |
          go install "github.com/gohugoio/hugo@v${HUGO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/hugo" version

      - name: Version
        id: version
        run: |
          documented=$(hugo config --format json | jq -r '.params.docs.version')
          if [ "${documented}" = main ]; then
            version=main
          else
            version=$(printf '%s\n' "${documented}" | sed -nE 's/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/\1.\2/p')
          fi
          if [ -z "${version}" ]; then
            echo "::error::params.docs.version in hugo.yaml is \"${documented}\", not vMAJOR.MINOR.PATCH or main"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "documented ${documented}: documentation version ${version}"

      # --panicOnWarning: a relref to a page that is not there, a deprecated
      # setting or a template warning fails the build rather than scrolling by.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: >-
          hugo --gc --minify --panicOnWarning --printPathWarnings
          --baseURL "${DOCS_URL}/${{ steps.version.outputs.version }}/"

      - name: Lay out the site for the link check
        run: |
          mkdir -p _check/docs
          cp -R public "_check/docs/${{ steps.version.outputs.version }}"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/_check
            '_check/docs/**/*.html'
          fail: true

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Never two deploys at once: both would push gh-pages and the second would
    # be rejected. cancel-in-progress stays false — killing a publish half way
    # through is worse than making it wait.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: gh-pages
          fetch-depth: 0

      - name: Switch to gh-pages
        working-directory: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
          else
            echo "no gh-pages branch yet: starting one"
            git checkout -q --orphan gh-pages
            git rm -rqf .
            git clean -fdxq
          fi

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      # ⛔ THE VERSION GOES AT THE BRANCH ROOT. This step used to write
      # docs/<version>/ — but a project repository named "docs" is ALREADY
      # served at /docs/, so the site landed at /docs/docs/<version>/ while
      # /docs/latest/ went on serving the MkDocs build mike had left there.
      # Both URLs answered 200, which is why the green deploy said nothing.
      #
      # pagespublish replaces that version and nothing else, writes
      # versions.json in mike's format (what the Hextra fork's version selector
      # reads), points latest at the newest release, leaves the root
      # redirecting to it, and removes the misplaced docs/ directory once.
      - name: Publish ${{ needs.build.outputs.version }}
        run: >-
          go run github.com/go-fleettools/fleettools/cmd/pagespublish@v0.26.0
          "${{ needs.build.outputs.version }}" site gh-pages

      - name: Push gh-pages
        id: push
        working-directory: gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "Deployed ${GITHUB_SHA::7} to ${{ needs.build.outputs.version }} with Hugo ${HUGO_VERSION}"
          git push origin HEAD:gh-pages
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ⛔ A GREEN PUSH IS NOT A PUBLISHED SITE. GitHub's legacy "pages build and
      # deployment" for the gh-pages branch sometimes stalls in updating_pages and
      # fails with "Timeout reached, aborting!" after 10 minutes (3 times on
      # 2026-11-05/06, runs 42058763350 and 42252993462); re-running it does not
      # help and re-running this workflow pushes nothing. pagesbuild waits for a
      # build of the pushed commit to be "built", requests a new one when it is
      # not, and fails this job if the site is still not built.
      - name: Wait for the Pages build
        if: steps.push.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "${GH_TOKEN}" > "${RUNNER_TEMP}/pages-token"
          go run github.com/go-fleettools/fleettools/cmd/pagesbuild@v0.80.0 \
            --token-file "${RUNNER_TEMP}/pages-token" \
            "${GITHUB_REPOSITORY}" "${{ steps.push.outputs.sha }}"
