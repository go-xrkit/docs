site_name: go-xrkit docs
site_description: "Pure-Go (CGO=0) geometry for immersive video: head orientation, stereo frame packing, and flat/equirectangular/fisheye projection, precomputed into a warp table, plus the 360 ribbon screens sit on and a graded catalogue of what each headset can actually show. One dependency, 100% coverage."
site_url: https://go-xrkit.github.io/docs/
repo_url: https://github.com/go-xrkit/xrkit
repo_name: go-xrkit/xrkit
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Packages: packages.md
  - Architecture: architecture.md
  - Repositories: repositories.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
